# Spotter ELD — assessment.vehicledailycheck.com
# Isolated from Vehicle Daily Check (do not edit VDC nginx sites).

upstream spotter_eld_api {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name assessment.vehicledailycheck.com;

    # Certbot will rewrite this block for HTTPS; keep ACME reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assessment.vehicledailycheck.com;

    # Managed by Certbot (paths filled / swapped on first issue):
    ssl_certificate     /etc/letsencrypt/live/assessment.vehicledailycheck.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assessment.vehicledailycheck.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/spotter-eld/access.log;
    error_log  /var/log/spotter-eld/error.log;

    root /var/www/spotter-eld/web;
    index index.html;

    client_max_body_size 2m;

    # Django API (gunicorn on 8001 — VDC uses 8000)
    location /api/ {
        proxy_pass http://spotter_eld_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Optional Django admin / static from WhiteNoise if needed later
    location /static/ {
        proxy_pass http://spotter_eld_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA / static React build
    location / {
        try_files $uri $uri/ /index.html;
    }
}
