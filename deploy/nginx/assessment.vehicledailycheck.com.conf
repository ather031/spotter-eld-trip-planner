# Spotter ELD — assessment.vehicledailycheck.com
# Isolated from Vehicle Daily Check. Do NOT edit VDC nginx sites.
# Gunicorn: 127.0.0.1:8001 (VDC uses 8000).
#
# First install: use this HTTP config, then:
#   sudo certbot --nginx -d assessment.vehicledailycheck.com
# Certbot will add the SSL server block / redirects.

upstream spotter_eld_api {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name assessment.vehicledailycheck.com;

    # Avoid UTF-8 mojibake in HTML titles (em dash / copyright) when clients
    # ignore <meta charset> or sniff Latin-1.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    access_log /var/log/spotter-eld/access.log;
    error_log  /var/log/spotter-eld/error.log;

    root /var/www/spotter-eld/web;
    index index.html;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django API
    location /api/ {
        proxy_pass http://spotter_eld_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # WhiteNoise / Django static (if used)
    location /static/ {
        proxy_pass http://spotter_eld_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets — long cache
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA shell — never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
